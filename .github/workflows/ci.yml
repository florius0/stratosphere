name: CI
on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@9596b92e70cbf68a494a2b0273cb5b680184f5fc # v3.13.1
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          source-url: https://github.com/florius0/magic-nix-cache/releases/download/test-cache-filter-1/magic-nix-cache.closure.xz
      - name: Build and deterministic checks with pinned tools
        run: nix run .#ci-check
      - name: Record Xcode development toolchain
        run: nix run .#ci-environment
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-environment
          path: .local/ci
          include-hidden-files: true
          if-no-files-found: warn

  environment-probes:
    needs: deterministic
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@9596b92e70cbf68a494a2b0273cb5b680184f5fc # v3.13.1
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          source-url: https://github.com/florius0/magic-nix-cache/releases/download/test-cache-filter-1/magic-nix-cache.closure.xz
      - name: Build and probe real AX and virtual displays (hosted coverage)
        run: nix run .#ci-probes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: environment-probe-evidence
          path: .local/ci/qualification
          include-hidden-files: true
          if-no-files-found: warn
